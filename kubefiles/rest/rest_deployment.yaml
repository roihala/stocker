apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-app
spec:
  selector:
    matchLabels:
      run: rest-app
  replicas: 1
  template:
    metadata:
      labels:
        run: rest-app
    spec:
      containers:
        - name: rest-app
          image: eu.gcr.io/stocker-439910/rest:latest
          env:
            - name: ENV
              value: "production"
            - name: MONGO_URI
              value: "mongodb+srv://doadmin:dYUhqv4V9H057681@db-mongodb-nyc3-51884-ccd4f7da.mongo.ondigitalocean.com/admin?retryWrites=true&w=majority"
            - name: TELEGRAM_TOKEN
              value: "1177225094:AAGtBg9BzIJVVXHelSSYnaQB6HBhyG1obiQ"
            - name: TITAN_MAIL
              value: "roihalamish@stocker.watch"
            - name: TITAN_PASS
              value: "P2b!$mH!tmwKGKY"
---
apiVersion: v1
kind: Service
metadata:
